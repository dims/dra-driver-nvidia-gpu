{{- if .Values.serviceAccount.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dra-driver-nvidia-gpu.persistentAgentControllerRoleName" . }}
  {{- if .Values.persistentComputeDomainAgents.admissionEnabled }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.persistentAgentObjectIdentity" . | nindent 4 }}
  {{- end }}
rules:
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomains"]
  verbs: ["get", "list", "watch", "update"]
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomains/status"]
  verbs: ["update"]
{{- if .Values.persistentComputeDomainAgents.admissionEnabled }}
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomaincliquereservations"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomaincliquereservations/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get", "list", "watch"]
{{- end }}
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaimtemplates"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
{{- if .Values.persistentComputeDomainAgents.admissionEnabled }}
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  resourceNames: [{{ include "dra-driver-nvidia-gpu.persistentAgentInstallationName" . | quote }}]
  verbs: ["get"]
{{- end }}
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
{{- if .Values.persistentComputeDomainAgents.admissionEnabled }}
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dra-driver-nvidia-gpu.serviceAccountName" $ }}-controller
  namespace: {{ include "dra-driver-nvidia-gpu.namespace" . }}
  labels:
    {{- include "dra-driver-nvidia-gpu.labels" $ | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dra-driver-nvidia-gpu.persistentAgentControllerBindingName" . }}
  {{- if .Values.persistentComputeDomainAgents.admissionEnabled }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.persistentAgentObjectIdentity" . | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dra-driver-nvidia-gpu.serviceAccountName" $ }}-controller
    namespace: {{ include "dra-driver-nvidia-gpu.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "dra-driver-nvidia-gpu.persistentAgentControllerRoleName" . }}
  apiGroup: rbac.authorization.k8s.io

{{- $driverNamespace := include "dra-driver-nvidia-gpu.namespace" . }}
{{- range $namespace := splitList "," (include "dra-driver-nvidia-gpu.namespaces" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dra-driver-nvidia-gpu.persistentAgentControllerNamespaceRoleName" $ }}
  namespace: {{ $namespace }}
  {{- if $.Values.persistentComputeDomainAgents.admissionEnabled }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.persistentAgentObjectIdentity" $ | nindent 4 }}
  {{- end }}
rules:
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomaincliques"]
  verbs: ["get", "list", "watch", "update"]
{{- if and $.Values.persistentComputeDomainAgents.admissionEnabled (eq $namespace $driverNamespace) }}
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomaincliquesnapshots"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomaincliquesnapshots/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomaincliqueretirementevidences"]
  verbs: ["get", "list", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dra-driver-nvidia-gpu.persistentAgentControllerNamespaceBindingName" $ }}
  namespace: {{ $namespace }}
  {{- if $.Values.persistentComputeDomainAgents.admissionEnabled }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.persistentAgentObjectIdentity" $ | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dra-driver-nvidia-gpu.serviceAccountName" $ }}-controller
    namespace: {{ include "dra-driver-nvidia-gpu.namespace" $ }}
roleRef:
  kind: Role
  name: {{ include "dra-driver-nvidia-gpu.persistentAgentControllerNamespaceRoleName" $ }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
