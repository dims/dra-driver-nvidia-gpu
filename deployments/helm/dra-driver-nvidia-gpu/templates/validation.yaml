{{- /*
The singleton is deliberately checked at render/install time in addition to
being protected by admission. This makes an ordinary second Helm install or
control-namespace migration fail before it creates namespaced resources.
`lookup` is empty for client-only `helm template`, where the rendered guard and
runtime preflight remain the enforcement boundaries.
*/ -}}
{{- $guardName := include "dra-driver-nvidia-gpu.controllerOwnedCDCInstallationName" . -}}
{{- $guard := lookup "rbac.authorization.k8s.io/v1" "ClusterRole" "" $guardName -}}
{{- if $guard -}}
  {{- $annotations := dig "metadata" "annotations" (dict) $guard -}}
  {{- $existingID := index $annotations "resource.nvidia.com/controller-owned-cdc-installation" | default "" -}}
  {{- $existingNamespace := index $annotations "resource.nvidia.com/controller-owned-cdc-control-namespace" | default "" -}}
  {{- $existingController := index $annotations "resource.nvidia.com/controller-owned-cdc-controller-subject" | default "" -}}
  {{- $existingKubelet := index $annotations "resource.nvidia.com/controller-owned-cdc-kubelet-subject" | default "" -}}
  {{- $existingControllerRole := index $annotations "resource.nvidia.com/controller-owned-cdc-controller-role" | default "" -}}
  {{- $existingKubeletRole := index $annotations "resource.nvidia.com/controller-owned-cdc-kubelet-role" | default "" -}}
  {{- $existingControllerBinding := index $annotations "resource.nvidia.com/controller-owned-cdc-controller-binding" | default "" -}}
  {{- $existingKubeletBinding := index $annotations "resource.nvidia.com/controller-owned-cdc-kubelet-binding" | default "" -}}
  {{- $existingControllerWorkload := index $annotations "resource.nvidia.com/controller-owned-cdc-controller-workload" | default "" -}}
  {{- $existingKubeletWorkload := index $annotations "resource.nvidia.com/controller-owned-cdc-kubelet-workload" | default "" -}}
  {{- $existingControllerNamespaceRole := index $annotations "resource.nvidia.com/controller-owned-cdc-controller-namespace-role" | default "" -}}
  {{- $existingControllerNamespaceBinding := index $annotations "resource.nvidia.com/controller-owned-cdc-controller-namespace-binding" | default "" -}}
  {{- $existingKubeletNamespaceRole := index $annotations "resource.nvidia.com/controller-owned-cdc-kubelet-namespace-role" | default "" -}}
  {{- $existingKubeletNamespaceBinding := index $annotations "resource.nvidia.com/controller-owned-cdc-kubelet-namespace-binding" | default "" -}}
  {{- $expectedID := include "dra-driver-nvidia-gpu.controllerOwnedCDCInstallationID" . -}}
  {{- $expectedNamespace := include "dra-driver-nvidia-gpu.namespace" . | trim -}}
  {{- $expectedController := include "dra-driver-nvidia-gpu.controllerServiceAccountUsername" . -}}
  {{- $expectedKubelet := include "dra-driver-nvidia-gpu.kubeletPluginServiceAccountUsername" . -}}
  {{- $expectedControllerRole := include "dra-driver-nvidia-gpu.controllerOwnedCDCControllerRoleName" . -}}
  {{- $expectedKubeletRole := include "dra-driver-nvidia-gpu.controllerOwnedCDCKubeletRoleName" . -}}
  {{- $expectedControllerBinding := include "dra-driver-nvidia-gpu.controllerOwnedCDCControllerBindingName" . -}}
  {{- $expectedKubeletBinding := include "dra-driver-nvidia-gpu.controllerOwnedCDCKubeletBindingName" . -}}
  {{- $expectedControllerWorkload := include "dra-driver-nvidia-gpu.controllerOwnedCDCControllerWorkloadName" . -}}
  {{- $expectedKubeletWorkload := include "dra-driver-nvidia-gpu.controllerOwnedCDCKubeletWorkloadName" . -}}
  {{- $expectedControllerNamespaceRole := include "dra-driver-nvidia-gpu.controllerOwnedCDCControllerNamespaceRoleName" . -}}
  {{- $expectedControllerNamespaceBinding := include "dra-driver-nvidia-gpu.controllerOwnedCDCControllerNamespaceBindingName" . -}}
  {{- $expectedKubeletNamespaceRole := include "dra-driver-nvidia-gpu.controllerOwnedCDCKubeletNamespaceRoleName" . -}}
  {{- $expectedKubeletNamespaceBinding := include "dra-driver-nvidia-gpu.controllerOwnedCDCKubeletNamespaceBindingName" . -}}
  {{- if or (ne $existingID $expectedID) (ne $existingNamespace $expectedNamespace) (ne $existingController $expectedController) (ne $existingKubelet $expectedKubelet) (ne $existingControllerRole $expectedControllerRole) (ne $existingKubeletRole $expectedKubeletRole) (ne $existingControllerBinding $expectedControllerBinding) (ne $existingKubeletBinding $expectedKubeletBinding) (ne $existingControllerWorkload $expectedControllerWorkload) (ne $existingKubeletWorkload $expectedKubeletWorkload) (ne $existingControllerNamespaceRole $expectedControllerNamespaceRole) (ne $existingControllerNamespaceBinding $expectedControllerNamespaceBinding) (ne $existingKubeletNamespaceRole $expectedKubeletNamespaceRole) (ne $existingKubeletNamespaceBinding $expectedKubeletNamespaceBinding) -}}
    {{- fail (printf "controller-owned CDC alpha supports one Helm installation in one immutable control namespace: cluster installation %q is owned by %q in namespace %q; release %q in namespace %q is rejected" $guardName $existingID $existingNamespace $expectedID $expectedNamespace) -}}
  {{- end -}}
{{- end -}}

{{- if .Values.namespace }}
{{- $error := "" }}
{{- $error = printf "%s\nValue 'namespace' set to %s" $error .Values.namespace }}
{{- $error = printf "%s\nSetting an explicit 'namespace' in values.yaml or via --set on the command line is no longer supported." $error }}
{{- $error = printf "%s\nUse --namespace (with --create-namespace as necessary) instead." $error }}
{{- $error = printf "%s\nSee: https://helm.sh/docs/helm/helm_install/#options" $error }}
{{- fail $error }}
{{- end }}

{{- if and (eq (include "dra-driver-nvidia-gpu.namespace" .) "default") ( eq .Values.namespaceOverride "") (not .Values.allowDefaultNamespace) }}
{{- $error := "" }}
{{- $error = printf "%s\nRunning in the 'default' namespace is not recommended." $error }}
{{- $error = printf "%s\nSet 'allowDefaultNamespace=true' to bypass this error." $error }}
{{- $error = printf "%s\nOtherwise, use --namespace (with --create-namespace as necessary) to run in a specific namespace." $error }}
{{- $error = printf "%s\nSee: https://helm.sh/docs/helm/helm_install/#options" $error }}
{{- fail $error }}
{{- end }}

{{- if and .Values.resources.gpus.enabled (not .Values.gpuResourcesEnabledOverride) }}
{{- $error := "" }}
{{- $error = printf "%s\n\nThe default value of 'resources.gpus.enabled == true'. However, when 'resources.gpus.enabled=true' this DRA driver cannot be deployed alongside the standard GPU device plugin on the same node. To avoid potential collisions between these two components, we will not allow this default to take effect until KEP 5004 has reached GA in upstream Kubernetes." $error }}
{{- $error = printf "%s\n" $error }}
{{- $error = printf "%s\nIf you are sure you have disabled the deployment of the standard GPU device plugin and want to remove this error and force 'resources.gpus.enabled=true', you must also:" $error }}
{{- $error = printf "%s\n" $error }}
{{- $error = printf "%s\n    --set 'gpuResourcesEnabledOverride=true'" $error }}
{{- $error = printf "%s\n" $error }}
{{- $error = printf "%s\nOnce KEP 5004 has reached GA, this DRA driver will be able to honour extended resource requests for 'nvidia.com/gpu' alongside requests made using ResourceClaims, essentially obsoleting the need for the standard GPU device plugin altogether. If you want to try this feature now, you can enable it in upstream Kubernetes v1.35+ by setting the 'DRAExtendedResource' feature gate on the 'kube-apiserver', 'kube-scheduler', 'kube-controller-manager', and 'kubelet'." $error }}
{{- fail $error }}
{{- end }}

{{- if .Values.nvidiaCtkPath }}
{{- $error := "" }}
{{- $error = printf "%s\nSetting a user-defined nvidiaCtkPath is no longer supported. It can simply be removed without consequence." $error }}
{{- $error = printf "%s\nIt was previously required to point the DRA driver at the host-path to the nvidia-ctk binary." $error }}
{{- $error = printf "%s\nThis, in turn, was used to execute any CDI hooks injected into containers by the DRA driver." $error }}
{{- $error = printf "%s\nNow a diffent binary is used called nvidia-cdi-hook that is installed by the DRA driver itself." $error }}
{{- $error = printf "%s\nThis renders the need for passing this user-defined flag obsolete." $error }}
{{- fail $error }}
{{- end }}

{{- if .Values.webhook.enabled }}
{{- if not .Values.webhook.tls }}
{{- $error := "" }}
{{- $error = printf "%s\nWebhook TLS configuration is required when webhook is enabled." $error }}
{{- $error = printf "%s\nPlease configure webhook.tls.mode and related settings." $error }}
{{- fail $error }}
{{- end }}

{{- if not .Values.webhook.tls.mode }}
{{- $error := "" }}
{{- $error = printf "%s\nWebhook TLS mode is required when webhook is enabled." $error }}
{{- $error = printf "%s\nSet webhook.tls.mode to either 'cert-manager' or 'secret'." $error }}
{{- fail $error }}
{{- end }}

{{- if not (or (eq .Values.webhook.tls.mode "cert-manager") (eq .Values.webhook.tls.mode "secret")) }}
{{- $error := "" }}
{{- $error = printf "%s\nInvalid webhook TLS mode: %s" $error .Values.webhook.tls.mode }}
{{- $error = printf "%s\nWebhook TLS mode must be either 'cert-manager' or 'secret'." $error }}
{{- fail $error }}
{{- end }}

{{- if eq .Values.webhook.tls.mode "cert-manager" }}
{{- if not .Values.webhook.tls.certManager }}
{{- $error := "" }}
{{- $error = printf "%s\nCert-manager configuration is required when using cert-manager mode." $error }}
{{- $error = printf "%s\nPlease configure webhook.tls.certManager settings." $error }}
{{- fail $error }}
{{- end }}

{{- if not .Values.webhook.tls.certManager.issuerType }}
{{- $error := "" }}
{{- $error = printf "%s\nCert-manager issuer type is required when using cert-manager mode." $error }}
{{- $error = printf "%s\nSet webhook.tls.certManager.issuerType to 'selfsigned', 'clusterissuer', or 'issuer'." $error }}
{{- fail $error }}
{{- end }}

{{- if not (or (eq .Values.webhook.tls.certManager.issuerType "selfsigned") (eq .Values.webhook.tls.certManager.issuerType "clusterissuer") (eq .Values.webhook.tls.certManager.issuerType "issuer")) }}
{{- $error := "" }}
{{- $error = printf "%s\nInvalid cert-manager issuer type: %s" $error .Values.webhook.tls.certManager.issuerType }}
{{- $error = printf "%s\nIssuer type must be 'selfsigned', 'clusterissuer', or 'issuer'." $error }}
{{- fail $error }}
{{- end }}

{{- if and (ne .Values.webhook.tls.certManager.issuerType "selfsigned") (not .Values.webhook.tls.certManager.issuerName) }}
{{- $error := "" }}
{{- $error = printf "%s\nCert-manager issuer name is required when issuer type is not 'selfsigned'." $error }}
{{- $error = printf "%s\nSet webhook.tls.certManager.issuerName to the name of your issuer." $error }}
{{- fail $error }}
{{- end }}
{{- end }}

{{- if eq .Values.webhook.tls.mode "secret" }}
{{- if not .Values.webhook.tls.secret }}
{{- $error := "" }}
{{- $error = printf "%s\nSecret configuration is required when using secret mode." $error }}
{{- $error = printf "%s\nPlease configure webhook.tls.secret settings." $error }}
{{- fail $error }}
{{- end }}

{{- if not .Values.webhook.tls.secret.name }}
{{- $error := "" }}
{{- $error = printf "%s\nSecret name is required when using secret mode." $error }}
{{- $error = printf "%s\nSet webhook.tls.secret.name to the name of your TLS secret." $error }}
{{- fail $error }}
{{- end }}
{{- end }}
{{- end }}

{{- if not (include "dra-driver-nvidia-gpu.resourceApiVersion" .) -}}
{{- $error := "" }}
{{- $error = printf "%s\nNo supported resource.k8s.io API version found in the cluster." $error }}
{{- $error = printf "%s\nThis chart requires one of: resource.k8s.io/v1, resource.k8s.io/v1beta1, or resource.k8s.io/v1beta2." $error }}
{{- $error = printf "%s\nPlease ensure your cluster supports Dynamic Resource Allocation (DRA) with one of these API versions." $error }}
{{- fail $error }}
{{- end }}
