{{- if .Values.persistentComputeDomainAgents.admissionEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dra-driver-nvidia-gpu.persistentAgentInstallationName" . }}
  labels:
    {{- include "dra-driver-nvidia-gpu.persistentAgentLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.persistentAgentMarkerAnnotations" . | nindent 4 }}
rules:
# This is installation identity data, not an RBAC grant: the synthetic API
# group does not exist.
- apiGroups: ["persistent-agent.resource.nvidia.com"]
  resources: ["legacydaemonnamespaces"]
  resourceNames: {{ splitList "," (include "dra-driver-nvidia-gpu.namespaces" .) | toJson }}
  verbs: ["get"]
{{- end }}
