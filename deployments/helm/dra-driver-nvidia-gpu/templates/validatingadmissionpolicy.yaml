apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.persistentAgentPolicyName" "persistent-agent-applied-state-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.persistentAgentLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.persistentAgentAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods"]
  matchConditions:
  - name: isPersistentAgent
    expression: >-
      params != null && request.userInfo.username ==
      'system:serviceaccount:'+params.metadata.annotations['resource.nvidia.com/persistent-agent-control-namespace']+':compute-domain-daemon-reader-service-account'
  variables:
  - name: podUIDs
    expression: request.userInfo.extra[?'authentication.kubernetes.io/pod-uid'].orValue([])
  - name: nodeNames
    expression: request.userInfo.extra[?'authentication.kubernetes.io/node-name'].orValue([])
  validations:
  - expression: >-
      object.metadata.namespace == params.metadata.annotations['resource.nvidia.com/persistent-agent-control-namespace'] &&
      variables.podUIDs.exists(uid, uid == string(object.metadata.uid)) &&
      variables.nodeNames.exists(name, name == object.spec.nodeName) &&
      object.metadata.?labels.orValue({})[?'resource.nvidia.com/persistentComputeDomainAgent'].orValue('') == 'true' &&
      object.metadata.?ownerReferences.orValue([]).exists(r,
        r.?controller.orValue(false) && r.apiVersion == 'apps/v1' && r.kind == 'DaemonSet' &&
        r.name == 'dra-driver-nvidia-gpu-persistent-agent' && string(r.uid) != '')
    message: applied state may be written only by the bound persistent-agent Pod
  - expression: >-
      object.spec == oldObject.spec && object.status == oldObject.status &&
      object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
      object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) &&
      object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
      (!has(object.metadata.annotations) || object.metadata.annotations.all(k, v,
        k == 'resource.nvidia.com/computeDomainCliqueSnapshotApplied' ||
        (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] == v))) &&
      (!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.all(k, v,
        k == 'resource.nvidia.com/computeDomainCliqueSnapshotApplied' ||
        (has(object.metadata.annotations) && k in object.metadata.annotations && object.metadata.annotations[k] == v)))
    message: persistent agent may change only its applied-snapshot annotation
  - expression: >-
      object.metadata.?annotations.orValue({})[?'resource.nvidia.com/computeDomainCliqueSnapshotApplied'].orValue('').size() <= 2048
    message: persistent-agent applied state is bounded
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.persistentAgentPolicyName" "computedomain-retirement-evidence-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.persistentAgentLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.persistentAgentAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: ["resource.nvidia.com"]
      apiVersions: ["v1beta1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["computedomaincliqueretirementevidences"]
  variables:
  - name: controller
    expression: >-
      params != null && request.userInfo.username ==
      params.metadata.annotations['resource.nvidia.com/persistent-agent-controller-subject']
  - name: reader
    expression: >-
      params != null && request.userInfo.username ==
      'system:serviceaccount:'+params.metadata.annotations['resource.nvidia.com/persistent-agent-control-namespace']+':compute-domain-daemon-reader-service-account'
  - name: podUID
    expression: request.userInfo.extra[?'authentication.kubernetes.io/pod-uid'][0].orValue('')
  - name: nodeUID
    expression: request.userInfo.extra[?'authentication.kubernetes.io/node-uid'][0].orValue('')
  validations:
  - expression: request.operation != 'UPDATE'
    message: retirement evidence is immutable and may not be updated
  - expression: request.operation != 'DELETE' || variables.controller
    message: only the compute-domain controller may delete durable retirement evidence
  - expression: request.operation != 'CREATE' || variables.reader
    message: only the compute-domain daemon reader may create retirement evidence
  - expression: >-
      request.operation != 'CREATE' ||
      (object.metadata.namespace == params.metadata.annotations['resource.nvidia.com/persistent-agent-control-namespace'] &&
       variables.podUID != '' && variables.nodeUID != '' &&
       string(object.spec.witnessPodUID) == variables.podUID &&
       string(object.spec.nodeUID) == variables.nodeUID)
    message: retirement evidence must match the Pod and Node UIDs bound into the daemon service-account token
  - expression: >-
      request.operation != 'CREATE' ||
      (object.metadata.name == 'retirement-'+string(object.spec.snapshotUID)+'-'+string(object.spec.index) &&
       object.metadata.?labels.orValue({}).size() == 1 &&
       object.metadata.labels['resource.nvidia.com/computeDomain'] != '')
    message: retirement evidence name and labels must match its immutable snapshot and ComputeDomain identity
{{- else }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: resourceslices-policy-{{ include "dra-driver-nvidia-gpu.name" . }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["resource.k8s.io"]
      apiVersions: ["v1", "v1beta1", "v1beta2"]
      operations:  ["CREATE", "UPDATE", "DELETE"]
      resources:   ["resourceslices"]
  matchConditions:
  - name: isRestrictedUser
    expression: >-
      request.userInfo.username == {{ include "dra-driver-nvidia-gpu.kubeletPluginServiceAccountUsername" . | quote }}
  variables:
  - name: userNodeName
    expression: >-
      request.userInfo.extra[?'authentication.kubernetes.io/node-name'][0].orValue('')
  - name: objectNodeName
    expression: >-
      (request.operation == "DELETE" ? oldObject : object).spec.?nodeName.orValue("")
  - name: nodeSelectorValue
    expression: >-
      (request.operation == "DELETE" ? oldObject : object).spec.?nodeSelector.orValue(null)
  - name: allNodesValue
    expression: >-
      (request.operation == "DELETE" ? oldObject : object).spec.?allNodes.orValue(false)
  validations:
  - expression: variables.userNodeName != ""
    message: >-
      no node association found for user, this user must run in a pod on a node and ServiceAccountTokenPodNodeInfo must be enabled
  - expression: variables.userNodeName == variables.objectNodeName || variables.allNodesValue == true || variables.nodeSelectorValue != null
    messageExpression: >-
      "this user running on node '"+variables.userNodeName+"' may not modify cluster or node resourceslices"
{{- end }}
