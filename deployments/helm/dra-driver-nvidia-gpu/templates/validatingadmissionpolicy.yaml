{{- if .Values.controllerOwnedCDCliques.admissionEnabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCInstallationName" . }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations: ["UPDATE", "DELETE"]
      resources: ["clusterroles"]
      resourceNames: [{{ include "dra-driver-nvidia-gpu.controllerOwnedCDCInstallationName" . | quote }}]
  variables:
  - name: ownerKeys
    expression: >-
      ['resource.nvidia.com/controller-owned-cdc-installation',
       'resource.nvidia.com/controller-owned-cdc-control-namespace',
       'resource.nvidia.com/controller-owned-cdc-controller-subject',
       'resource.nvidia.com/controller-owned-cdc-kubelet-subject',
       'resource.nvidia.com/controller-owned-cdc-controller-role',
       'resource.nvidia.com/controller-owned-cdc-kubelet-role',
       'resource.nvidia.com/controller-owned-cdc-controller-binding',
       'resource.nvidia.com/controller-owned-cdc-kubelet-binding',
       'resource.nvidia.com/controller-owned-cdc-legacy-daemon-role',
       'resource.nvidia.com/controller-owned-cdc-legacy-daemon-binding',
       'resource.nvidia.com/controller-owned-cdc-controller-workload',
       'resource.nvidia.com/controller-owned-cdc-kubelet-workload',
       'resource.nvidia.com/controller-owned-cdc-controller-namespace-role',
       'resource.nvidia.com/controller-owned-cdc-controller-namespace-binding',
       'resource.nvidia.com/controller-owned-cdc-kubelet-namespace-role',
       'resource.nvidia.com/controller-owned-cdc-kubelet-namespace-binding']
  validations:
  - expression: >-
      request.operation != 'UPDATE' ||
      (has(oldObject.metadata.annotations) && has(object.metadata.annotations) &&
       variables.ownerKeys.all(k,
         k in oldObject.metadata.annotations && k in object.metadata.annotations &&
         oldObject.metadata.annotations[k] == object.metadata.annotations[k]))
    message: controller-owned CDC installation, control namespace, and ServiceAccount identities are immutable; a second release or control-namespace migration is unsupported
  - expression: >-
      request.operation != 'DELETE' ||
      (has(oldObject.metadata.annotations) &&
       oldObject.metadata.annotations[?'resource.nvidia.com/unsafe-controller-owned-cdc-decommission'].orValue('') == 'approved')
    message: controller-owned CDC installation identity may not be deleted; complete the explicit fenced decommission procedure first
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCPolicyName" "controllerownedcdc-rbac-binding-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["clusterrolebindings"]
  variables:
  - name: controllerRole
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-role']
  - name: kubeletRole
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-role']
  - name: controllerBinding
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-binding']
  - name: kubeletBinding
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-binding']
  - name: daemonRole
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-legacy-daemon-role']
  - name: daemonBinding
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-legacy-daemon-binding']
  - name: controllerSubject
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-subject']
  - name: kubeletSubject
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-subject']
  - name: controllerWorkload
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-workload']
  - name: kubeletWorkload
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-workload']
  - name: subjectUsernames
    expression: object.subjects.filter(s, s.kind == 'ServiceAccount').map(s, 'system:serviceaccount:'+s.namespace+':'+s.name)
  validations:
  - expression: >-
      object.roleRef.name != variables.controllerRole ||
      (object.metadata.name == variables.controllerBinding && size(object.subjects) == 1 && variables.subjectUsernames == [variables.controllerSubject])
    message: the controller ClusterRole may be bound only to the immutable installation controller ServiceAccount
  - expression: >-
      object.roleRef.name != variables.kubeletRole ||
      (object.metadata.name == variables.kubeletBinding && size(object.subjects) == 1 && variables.subjectUsernames == [variables.kubeletSubject])
    message: the kubelet-plugin ClusterRole may be bound only to the immutable installation kubelet ServiceAccount
  - expression: >-
      object.roleRef.name != variables.daemonRole ||
      (object.metadata.name == variables.daemonBinding && object.subjects.all(s,
        s.kind == 'ServiceAccount' && s.name == 'compute-domain-daemon-service-account' &&
        params.rules.exists(r, r.apiGroups == ['controller-owned-cdc.resource.nvidia.com'] &&
          r.resources == ['legacydaemonnamespaces'] && has(r.resourceNames) && s.namespace in r.resourceNames)))
    message: the legacy daemon ClusterRole may be bound only in namespaces owned by the immutable installation
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCPolicyName" "controllerownedcdc-namespaced-rbac-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["roles", "rolebindings"]
      resourceNames:
      - {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCControllerNamespaceRoleName" . | quote }}
      - {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCControllerNamespaceBindingName" . | quote }}
      - {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCKubeletNamespaceRoleName" . | quote }}
      - {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCKubeletNamespaceBindingName" . | quote }}
  variables:
  - name: installation
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-installation']
  - name: controllerRole
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-namespace-role']
  - name: controllerBinding
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-namespace-binding']
  - name: kubeletRole
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-namespace-role']
  - name: kubeletBinding
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-namespace-binding']
  - name: controllerSubject
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-subject']
  - name: kubeletSubject
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-subject']
  - name: actualInstallation
    expression: object.metadata.?annotations.orValue({})[?'resource.nvidia.com/controller-owned-cdc-installation'].orValue('')
  - name: subjectUsernames
    expression: >-
      object.kind == 'RoleBinding' ? object.subjects.filter(s, s.kind == 'ServiceAccount').map(s, 'system:serviceaccount:'+s.namespace+':'+s.name) : []
  validations:
  - expression: variables.actualInstallation == variables.installation
    message: protected controller-owned CDC namespaced RBAC belongs to the immutable installation
  - expression: >-
      object.kind != 'RoleBinding' ||
      (object.metadata.name == variables.controllerBinding && object.roleRef.name == variables.controllerRole && size(object.subjects) == 1 && variables.subjectUsernames == [variables.controllerSubject]) ||
      (object.metadata.name == variables.kubeletBinding && object.roleRef.name == variables.kubeletRole && size(object.subjects) == 1 && variables.subjectUsernames == [variables.kubeletSubject])
    message: protected controller-owned CDC namespaced RoleBindings may bind only the immutable installation subjects
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCPolicyName" "controllerownedcdc-workload-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets"]
  variables:
  - name: controlNamespace
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-control-namespace']
  - name: installation
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-installation']
  - name: controllerSubject
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-subject']
  - name: kubeletSubject
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-subject']
  - name: controllerWorkload
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-workload']
  - name: kubeletWorkload
    expression: params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-workload']
  - name: expectedSubject
    expression: >-
      object.kind == 'Deployment' ? variables.controllerSubject : variables.kubeletSubject
  - name: actualSubject
    expression: >-
      'system:serviceaccount:'+object.metadata.namespace+':'+object.spec.template.spec.?serviceAccountName.orValue('default')
  - name: installationAnnotation
    expression: object.metadata.?annotations.orValue({})[?'resource.nvidia.com/controller-owned-cdc-installation'].orValue('')
  validations:
  - expression: >-
      !has(object.metadata.labels) || !('resource.nvidia.com/controller-owned-cdc-workload' in object.metadata.labels) ||
      (object.metadata.namespace == variables.controlNamespace && variables.installationAnnotation == variables.installation &&
       variables.actualSubject == variables.expectedSubject)
    message: controller-owned CDC privileged workloads must use the immutable installation namespace and ServiceAccounts
  - expression: >-
      variables.actualSubject != variables.controllerSubject && variables.actualSubject != variables.kubeletSubject ||
      (object.metadata.namespace == variables.controlNamespace && variables.installationAnnotation == variables.installation &&
       has(object.metadata.labels) && 'resource.nvidia.com/controller-owned-cdc-workload' in object.metadata.labels) ||
      (object.metadata.namespace == variables.controlNamespace &&
       ((object.kind == 'Deployment' && object.metadata.name == variables.controllerWorkload && variables.actualSubject == variables.controllerSubject) ||
        (object.kind == 'DaemonSet' && object.metadata.name == variables.kubeletWorkload && variables.actualSubject == variables.kubeletSubject)))
    message: immutable installation ServiceAccounts may be used only by installation-owned controller and kubelet workloads
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCPolicyName" "resourceslices-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups:   ["resource.k8s.io"]
      apiVersions: ["v1", "v1beta1", "v1beta2"]
      operations:  ["CREATE", "UPDATE", "DELETE"]
      resources:   ["resourceslices"]
  matchConditions:
  - name: isRestrictedUser
    expression: >-
      request.userInfo.username == params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-subject']
  variables:
  - name: userNodeName
    expression: >-
      request.userInfo.extra[?'authentication.kubernetes.io/node-name'][0].orValue('')
  - name: objectNodeName
    expression: >-
      (request.operation == "DELETE" ? oldObject : object).spec.?nodeName.orValue("")
  - name: nodeSelectorValue
    expression: >-
      (request.operation == "DELETE" ? oldObject : object).spec.?nodeSelector.orValue(null)
  - name: allNodesValue
    expression: >-
      (request.operation == "DELETE" ? oldObject : object).spec.?allNodes.orValue(false)
  validations:
  - expression: variables.userNodeName != ""
    message: >-
      no node association found for user, this user must run in a pod on a node and ServiceAccountTokenPodNodeInfo must be enabled
  - expression: variables.userNodeName == variables.objectNodeName || variables.allNodesValue == true || variables.nodeSelectorValue != null
    messageExpression: >-
      "this user running on node '"+variables.userNodeName+"' may not modify cluster or node resourceslices"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCPolicyName" "computedomain-reserved-metadata-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: ["resource.nvidia.com"]
      apiVersions: ["v1beta1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["computedomains"]
  validations:
  - expression: params != null
    message: controller-owned CDC installation identity is missing
  - expression: >-
      request.operation != 'CREATE' ||
      !has(object.metadata.finalizers) ||
      !object.metadata.finalizers.exists(f, f == 'resource.nvidia.com/computeDomain')
    message: the resource.nvidia.com/computeDomain finalizer is controller-owned and may not be supplied at creation
  - expression: >-
      request.operation != 'UPDATE' ||
      ((has(oldObject.metadata.finalizers) && oldObject.metadata.finalizers.exists(f, f == 'resource.nvidia.com/computeDomain')) ==
       (has(object.metadata.finalizers) && object.metadata.finalizers.exists(f, f == 'resource.nvidia.com/computeDomain'))) ||
      request.userInfo.username ==
      params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-subject']
    message: only the compute-domain controller may add or remove its reserved finalizer
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCPolicyName" "computedomain-node-topology-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["nodes"]
  matchConditions:
  - name: isComputeDomainKubeletPlugin
    expression: >-
      params != null && request.userInfo.username ==
      params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-subject']
  variables:
  - name: userNodeName
    expression: >-
      request.userInfo.extra[?'authentication.kubernetes.io/node-name'][0].orValue('')
  validations:
  - expression: variables.userNodeName != '' && object.metadata.name == variables.userNodeName
    message: the kubelet plugin may update only the Node bound into its service-account token
  - expression: object.spec == oldObject.spec
    message: the kubelet plugin may not change Node spec
  - expression: >-
      object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) &&
      object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([])
    message: the kubelet plugin may not change Node finalizers or owner references
  - expression: >-
      (!has(object.metadata.labels) ||
       object.metadata.labels.all(k, v,
         k in ['nvidia.com/gpu.clique', 'resource.nvidia.com/computeDomain'] ||
         (has(oldObject.metadata.labels) && k in oldObject.metadata.labels && oldObject.metadata.labels[k] == v))) &&
      (!has(oldObject.metadata.labels) ||
       oldObject.metadata.labels.all(k, v,
         k in ['nvidia.com/gpu.clique', 'resource.nvidia.com/computeDomain'] ||
         (has(object.metadata.labels) && k in object.metadata.labels && object.metadata.labels[k] == v)))
    message: the kubelet plugin may change only GPU clique topology and the legacy ComputeDomain route; controller-v1 membership requires controller attestation
  - expression: >-
      object.metadata.?labels.orValue({})[?'resource.nvidia.com/controllerOwnedComputeDomain'].orValue('') == '' ||
      object.metadata.?labels.orValue({})[?'resource.nvidia.com/computeDomain'].orValue('') ==
      oldObject.metadata.?labels.orValue({})[?'resource.nvidia.com/computeDomain'].orValue('')
    message: the legacy kubelet may not enter a Node isolated for a controller-owned ComputeDomain
  - expression: >-
      (!has(object.metadata.annotations) ||
       object.metadata.annotations.all(k, v,
         k in ['resource.nvidia.com/computeDomainCliqueStartupID', 'resource.nvidia.com/computeDomainCliqueProtocolCapability'] ||
         (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] == v))) &&
      (!has(oldObject.metadata.annotations) ||
       oldObject.metadata.annotations.all(k, v,
         k in ['resource.nvidia.com/computeDomainCliqueStartupID', 'resource.nvidia.com/computeDomainCliqueProtocolCapability'] ||
         (has(object.metadata.annotations) && k in object.metadata.annotations && object.metadata.annotations[k] == v)))
    message: the kubelet plugin may change only its startup-topology and controller-v1 capability Node annotations
  - expression: >-
      !has(oldObject.metadata.annotations) ||
      !('resource.nvidia.com/computeDomainCliqueStartupID' in oldObject.metadata.annotations) ||
      (has(object.metadata.annotations) &&
       'resource.nvidia.com/computeDomainCliqueStartupID' in object.metadata.annotations &&
       object.metadata.annotations['resource.nvidia.com/computeDomainCliqueStartupID'] ==
       oldObject.metadata.annotations['resource.nvidia.com/computeDomainCliqueStartupID'])
    message: the startup GPU clique identity is immutable; drain and fence the node before an operator clears it
  - expression: >-
      !has(object.metadata.annotations) ||
      !('resource.nvidia.com/computeDomainCliqueProtocolCapability' in object.metadata.annotations) ||
      object.metadata.annotations['resource.nvidia.com/computeDomainCliqueProtocolCapability'] == 'controller-v1'
    message: the kubelet plugin capability marker has an unsupported value
  - expression: >-
      object.metadata.?labels.orValue({})[?'nvidia.com/gpu.clique'].orValue('') ==
      oldObject.metadata.?labels.orValue({})[?'nvidia.com/gpu.clique'].orValue('') &&
      object.metadata.?annotations.orValue({})[?'resource.nvidia.com/computeDomainCliqueStartupID'].orValue('') ==
      oldObject.metadata.?annotations.orValue({})[?'resource.nvidia.com/computeDomainCliqueStartupID'].orValue('') ||
      object.metadata.?labels.orValue({})[?'nvidia.com/gpu.clique'].orValue('') == '' ||
      object.metadata.?labels.orValue({})[?'nvidia.com/gpu.clique'].orValue('') ==
      object.metadata.?annotations.orValue({})[?'resource.nvidia.com/computeDomainCliqueStartupID'].orValue('')
    message: the published GPU clique label must match the immutable startup identity
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCPolicyName" "computedomain-node-attestation-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["nodes"]
  variables:
  - name: controller
    expression: params != null && request.userInfo.username == params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-subject']
  - name: legacyKubelet
    expression: >-
      params != null && request.userInfo.username == params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-kubelet-subject'] &&
      request.userInfo.extra[?'authentication.kubernetes.io/node-name'][0].orValue('') == object.metadata.name
  - name: oldDomain
    expression: oldObject.metadata.?labels.orValue({})[?'resource.nvidia.com/computeDomain'].orValue('')
  - name: newDomain
    expression: object.metadata.?labels.orValue({})[?'resource.nvidia.com/computeDomain'].orValue('')
  - name: oldAttestation
    expression: oldObject.metadata.?annotations.orValue({})[?'resource.nvidia.com/computeDomainAttestation'].orValue('')
  - name: newAttestation
    expression: object.metadata.?annotations.orValue({})[?'resource.nvidia.com/computeDomainAttestation'].orValue('')
  - name: oldIsolation
    expression: oldObject.metadata.?labels.orValue({})[?'resource.nvidia.com/controllerOwnedComputeDomain'].orValue('')
  - name: newIsolation
    expression: object.metadata.?labels.orValue({})[?'resource.nvidia.com/controllerOwnedComputeDomain'].orValue('')
  validations:
  - expression: >-
      (variables.oldDomain == variables.newDomain && variables.oldAttestation == variables.newAttestation) ||
      variables.controller ||
      (variables.legacyKubelet && variables.oldAttestation == variables.newAttestation && variables.newAttestation == '')
    message: only the compute-domain controller may change claim attestation; the bound kubelet may change an unattested legacy route
  - expression: variables.oldAttestation == '' || variables.oldIsolation == variables.newIsolation
    message: whole-clique isolation is immutable while a controller-owned Node attestation is active; clear the attestation through the controller before draining isolation
  - expression: >-
      !variables.controller ||
      (object.spec == oldObject.spec && object.status == oldObject.status &&
       object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) &&
       object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
       (!has(object.metadata.labels) || object.metadata.labels.all(k, v,
         k == 'resource.nvidia.com/computeDomain' ||
         (has(oldObject.metadata.labels) && k in oldObject.metadata.labels && oldObject.metadata.labels[k] == v))) &&
       (!has(oldObject.metadata.labels) || oldObject.metadata.labels.all(k, v,
         k == 'resource.nvidia.com/computeDomain' ||
         (has(object.metadata.labels) && k in object.metadata.labels && object.metadata.labels[k] == v))) &&
       (!has(object.metadata.annotations) || object.metadata.annotations.all(k, v,
         k == 'resource.nvidia.com/computeDomainAttestation' ||
         (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] == v))) &&
       (!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.all(k, v,
         k == 'resource.nvidia.com/computeDomainAttestation' ||
         (has(object.metadata.annotations) && k in object.metadata.annotations && object.metadata.annotations[k] == v))))
    message: the compute-domain controller may change only ComputeDomain routing and attestation Node metadata
  - expression: >-
      variables.oldIsolation == variables.newIsolation ||
      (variables.oldDomain == '' && variables.newDomain == '' &&
       variables.oldAttestation == '' && variables.newAttestation == '')
    message: whole-clique isolation may change only while the Node has no ComputeDomain route or attestation
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCPolicyName" "computedomain-protocol-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: ["resource.nvidia.com"]
      apiVersions: ["v1beta1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["computedomains"]
  validations:
  - expression: >-
      request.operation != 'CREATE' ||
      !has(object.metadata.annotations) ||
      !('resource.nvidia.com/requestedComputeDomainCliqueProtocol' in object.metadata.annotations) ||
      object.metadata.annotations['resource.nvidia.com/requestedComputeDomainCliqueProtocol'] != 'controller-v1' ||
      params != null &&
      params.rules.exists(r,
        r.apiGroups == ['controller-owned-cdc.resource.nvidia.com'] &&
        r.resources == ['canarynamespaces'] &&
        has(r.resourceNames) && object.metadata.namespace in r.resourceNames)
    message: controller-v1 is an operator-controlled canary protocol and this namespace is not allowlisted by controllerOwnedCDCliques.canaryNamespaces
  - expression: >-
      request.operation == 'CREATE' ?
        (!has(object.metadata.annotations) ||
         !('resource.nvidia.com/requestedComputeDomainCliqueProtocol' in object.metadata.annotations) ||
         object.metadata.annotations['resource.nvidia.com/requestedComputeDomainCliqueProtocol'] in ['legacy-v1', 'controller-v1']) :
        ((!has(oldObject.metadata.annotations) ||
          !('resource.nvidia.com/requestedComputeDomainCliqueProtocol' in oldObject.metadata.annotations)) ?
           (!has(object.metadata.annotations) ||
            !('resource.nvidia.com/requestedComputeDomainCliqueProtocol' in object.metadata.annotations)) :
           (has(object.metadata.annotations) &&
            'resource.nvidia.com/requestedComputeDomainCliqueProtocol' in object.metadata.annotations &&
            object.metadata.annotations['resource.nvidia.com/requestedComputeDomainCliqueProtocol'] ==
            oldObject.metadata.annotations['resource.nvidia.com/requestedComputeDomainCliqueProtocol']))
    message: requestedComputeDomainCliqueProtocol must be legacy-v1 or controller-v1 and is immutable after creation
  - expression: >-
      request.operation != 'CREATE' ||
      !has(object.metadata.annotations) ||
      !('resource.nvidia.com/computeDomainCliqueProtocol' in object.metadata.annotations)
    message: computeDomainCliqueProtocol is controller-owned and may not be supplied when a ComputeDomain is created
  - expression: >-
      !has(object.metadata.annotations) ||
      !('resource.nvidia.com/computeDomainCliqueProtocol' in object.metadata.annotations) ||
      object.metadata.annotations['resource.nvidia.com/computeDomainCliqueProtocol'] in ['legacy-v1', 'controller-v1']
    message: the ComputeDomain clique protocol must be legacy-v1 or controller-v1
  - expression: >-
      request.operation == 'CREATE' ||
      (has(oldObject.metadata.annotations) &&
       'resource.nvidia.com/computeDomainCliqueProtocol' in oldObject.metadata.annotations &&
       has(object.metadata.annotations) &&
       object.metadata.annotations['resource.nvidia.com/computeDomainCliqueProtocol'] ==
       oldObject.metadata.annotations['resource.nvidia.com/computeDomainCliqueProtocol']) ||
      (params != null && request.userInfo.username ==
       params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-subject'] &&
       (!has(oldObject.metadata.annotations) ||
        !('resource.nvidia.com/computeDomainCliqueProtocol' in oldObject.metadata.annotations)) &&
       has(object.metadata.annotations) &&
       'resource.nvidia.com/computeDomainCliqueProtocol' in object.metadata.annotations)
    message: the persisted ComputeDomain clique protocol is immutable; migrate by drain and recreate
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-nvidia-gpu.controllerOwnedCDCPolicyName" "computedomain-reservation-writer-policy" }}
  labels:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCLabels" . | nindent 4 }}
  annotations:
    {{- include "dra-driver-nvidia-gpu.controllerOwnedCDCAnnotations" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
  matchConstraints:
    resourceRules:
    - apiGroups: ["resource.nvidia.com"]
      apiVersions: ["v1beta1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["computedomaincliquereservations", "computedomaincliquereservations/status"]
  validations:
  - expression: >-
      params != null && request.userInfo.username ==
      params.metadata.annotations['resource.nvidia.com/controller-owned-cdc-controller-subject'] &&
      (request.operation != 'DELETE' || oldObject.?status.phase.orValue('') == 'Released')
    message: only the compute-domain controller may write reservations, and DELETE requires a durable Released status
---
