    controller-gen.kubebuilder.io/version: v0.17.1
  name: computedomaincliquesnapshots.resource.nvidia.com
spec:
  group: resource.nvidia.com
  names:
    kind: ComputeDomainCliqueSnapshot
    listKind: ComputeDomainCliqueSnapshotList
    plural: computedomaincliquesnapshots
    shortNames:
    - cdcsnapshot
    singular: computedomaincliquesnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cliqueID
      name: Clique
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.memberCount
      name: Members
      type: integer
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          ComputeDomainCliqueSnapshot is the controller-owned allocation and current
          membership snapshot for one hardware clique in one ComputeDomain. Daemons
          are read-only consumers of this object.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ComputeDomainCliqueSnapshotSpec is immutable scope. All frequently changing
              controller-owned data lives in the status subresource.
            properties:
              capacity:
                maximum: 1024
                minimum: 1
                type: integer
              cliqueID:
                minLength: 1
                type: string
              computeDomainName:
                minLength: 1
                type: string
              computeDomainNamespace:
                minLength: 1
                type: string
              computeDomainUID:
                description: |-
                  UID is a type that holds unique ID values, including UUIDs.  Because we
                  don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                  intent and helps make sure that UIDs and names do not get conflated.
                type: string
                x-kubernetes-validations:
                - message: computeDomainUID must not be empty
                  rule: self != ''
              daemonSetName:
                description: |-
                  DaemonSetName and DaemonSetUID identify the only same-namespace workload
                  whose Pods may be admitted into this snapshot. The DaemonSet is also the
                  snapshot's Kubernetes owner; the cross-namespace ComputeDomain identity
                  above remains an explicit, immutable reference rather than an invalid
                  ownerReference.
                minLength: 1
                type: string
              daemonSetUID:
                description: |-
                  UID is a type that holds unique ID values, including UUIDs.  Because we
                  don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                  intent and helps make sure that UIDs and names do not get conflated.
                type: string
              protocol:
                description: |-
                  ComputeDomainCliqueProtocol identifies the component which owns clique
                  allocation and membership for one ComputeDomain. The value is persisted in
                  generated claim configuration, so it must not be inferred from feature-gate
                  state or from whether a particular API object happens to exist.
                enum:
                - controller-v1
                type: string
            required:
            - capacity
            - cliqueID
            - computeDomainName
            - computeDomainNamespace
            - computeDomainUID
            - daemonSetName
            - daemonSetUID
            - protocol
            type: object
            x-kubernetes-validations:
            - message: snapshot spec is immutable
              rule: self == oldSelf
          status:
            properties:
              assignments:
                items:
                  description: |-
                    ComputeDomainCliqueAssignment is durable slot ownership. An ever-published
                    assignment is retained and quarantined after ambiguous loss; absence and
                    elapsed time alone never make it reusable.
                  properties:
                    currentPodUID:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                    everPublished:
                      type: boolean
                    index:
                      minimum: 0
                      type: integer
                    lastAuthorizedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    nodeName:
                      maxLength: 253
                      minLength: 1
                      type: string
                    nodeUID:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                      x-kubernetes-validations:
                      - message: nodeUID must not be empty
                        rule: self != ''
                    state:
                      enum:
                      - Bound
                      - Quarantined
                      - Fenced
                      type: string
                  required:
                  - everPublished
                  - index
                  - nodeName
                  - nodeUID
                  - state
                  type: object
                  x-kubernetes-validations:
                  - message: assignment index must be non-negative
                    rule: self.index >= 0
                  - message: an existing assignment may not become unpublished
                    rule: '!oldSelf.everPublished || self.everPublished'
                maxItems: 1024
                type: array
                x-kubernetes-list-map-keys:
                - nodeUID
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              generation:
                description: Generation increases only when the semantic active membership
                  changes.
                format: int64
                minimum: 0
                type: integer
              hash:
                description: Hash is a SHA-256 digest of the canonical, index-ordered
                  membership.
                pattern: ^$|^[a-f0-9]{64}$
                type: string
              memberCount:
                minimum: 0
                type: integer
              members:
                items:
                  description: |-
                    ComputeDomainCliqueMember binds one durable assignment to the exact current
                    daemon Pod incarnation and address which may consume it.
                  properties:
                    daemonSetUID:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                      x-kubernetes-validations:
                      - message: daemonSetUID must not be empty
                        rule: self != ''
                    index:
                      minimum: 0
                      type: integer
                    nodeName:
                      maxLength: 253
                      minLength: 1
                      type: string
                    nodeUID:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                      x-kubernetes-validations:
                      - message: nodeUID must not be empty
                        rule: self != ''
                    podIP:
                      format: ip
                      type: string
                    podName:
                      minLength: 1
                      type: string
                    podUID:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                      x-kubernetes-validations:
                      - message: podUID must not be empty
                        rule: self != ''
                  required:
                  - daemonSetUID
                  - index
                  - nodeName
                  - nodeUID
                  - podIP
                  - podName
                  - podUID
                  type: object
                  x-kubernetes-validations:
                  - message: member index must be non-negative
                    rule: self.index >= 0
                maxItems: 1024
                type: array
                x-kubernetes-list-map-keys:
                - index
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Active
                - Retiring
                - Fenced
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: assignment indices must be below snapshot capacity
          rule: '!has(self.status) || !has(self.status.assignments) || self.status.assignments.all(a,
            a.index < self.spec.capacity)'
        - message: member indices must be below snapshot capacity
          rule: '!has(self.status) || !has(self.status.members) || self.status.members.all(m,
            m.index < self.spec.capacity)'
        - message: assignment indices must be unique
          rule: '!has(self.status) || !has(self.status.assignments) || self.status.assignments.map(a,
            a.index).size() == self.status.assignments.size()'
        - message: memberCount must equal the member list size
          rule: '!has(self.status) || (!has(self.status.members) ? self.status.memberCount
            == 0 : self.status.memberCount == self.status.members.size())'
        - message: published and retiring snapshots require members and a SHA-256
            hash
          rule: '!has(self.status) || !has(self.status.phase) || !(self.status.phase
            in [''Active'', ''Retiring'', ''Fenced'']) || (self.status.memberCount
            > 0 && self.status.hash.size() == 64)'
        - message: snapshot generation may not decrease
          rule: '!has(oldSelf.status) || !has(self.status) || self.status.generation
            >= oldSelf.status.generation'
        - message: snapshot phase transition is invalid
          rule: '!has(oldSelf.status) || !has(oldSelf.status.phase) || oldSelf.status.phase
            == self.status.phase || (oldSelf.status.phase == ''Pending'' && self.status.phase
            == ''Active'') || (oldSelf.status.phase == ''Active'' && self.status.phase
            == ''Retiring'') || (oldSelf.status.phase == ''Retiring'' && self.status.phase
            == ''Fenced'')'
        - message: retirement may not change the published generation, hash, or member
            set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.phase) || !(oldSelf.status.phase
            in [''Active'', ''Retiring'']) || !(self.status.phase in [''Retiring'',
            ''Fenced'']) || (self.status.generation == oldSelf.status.generation &&
            self.status.hash == oldSelf.status.hash && self.status.members == oldSelf.status.members
            && self.status.memberCount == oldSelf.status.memberCount)'
        - message: Fenced snapshots require every published assignment to be Fenced
          rule: '!has(self.status) || !has(self.status.phase) || self.status.phase
            != ''Fenced'' || self.status.assignments.all(a, !a.everPublished || a.state
            == ''Fenced'')'
